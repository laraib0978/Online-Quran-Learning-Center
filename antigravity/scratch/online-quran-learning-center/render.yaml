services:
  - type: web
    name: online-quran-learning-center
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: RECEIVER_EMAIL
        value: onlinelearningqurancenter@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: onlinelearningqurancenter@gmail.com
